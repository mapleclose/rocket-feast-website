version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-aria:
        patterns: ["react-aria*", "@react-aria/*", "react-stately*", "@react-stately/*"]
        update-types: ["patch", "minor"]
      tailwind:
        patterns: ["tailwind*", "@tailwindcss/*"]
        update-types: ["patch", "minor"]
      types:
        patterns: ["@types/*"]
        update-types: ["patch", "minor"]
      eslint:
        patterns: ["eslint*", "@eslint/*", "@typescript-eslint/*"]
        update-types: ["patch", "minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["patch", "minor"]
