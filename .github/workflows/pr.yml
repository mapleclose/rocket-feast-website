name: PR Checks

on:
  pull_request:
    branches: [main]

# Dedupe overlapping events on the same PR. opened+labeled fires
# back-to-back when a PR is created with a label, and synchronize
# fires for every push — without this, each PR can burn N× the CI
# minutes it actually needs. Keyed on commit SHA (rather than PR
# number) so events targeting the same commit collapse cleanly even
# across event types — consistent with the parent fix in
# rocket-feast-admin#308.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Skip workflow-only Dependabot bumps (github_actions, docker) — they
    # don't change app code and the Dependabot auto-merge workflow's
    # own if-filter already excludes them from auto-merging. Skipped
    # jobs report as success for required-status-check rules.
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') && !startsWith(github.head_ref, 'dependabot/docker/') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
