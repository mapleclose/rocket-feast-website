# Auto-merges Dependabot PRs for patch + minor version bumps after CI
# passes. Major bumps and github_actions ecosystem bumps (any version)
# fall through to manual review.
#
# Re-enabled 2026-05-14 after PR-level CI + required status checks
# rolled out across all repos (so auto-merge has real gates).
#
# Requires (already in place at mapleclose repo-settings level):
#   - allow_auto_merge: true
#   - .github/dependabot.yml
#   - CI checks gating the target branch (where applicable)
name: Dependabot auto-merge

on:
  pull_request:
    # Only trigger on PRs that touch files Dependabot actually changes —
    # so human PRs (which never touch lockfiles or workflows) don't
    # generate a "skipped" check entry in their status rollup.
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for safe (non-workflow) updates
        if: |
          steps.metadata.outputs.package-ecosystem != 'github_actions' && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
